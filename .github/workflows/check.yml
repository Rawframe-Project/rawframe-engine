name: check

# Runs the full check on the owner's self-hosted machine for pushes to main.
# There is deliberately no pull_request trigger: a pull request from a fork must
# never run code on that machine.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A run in progress finishes: pushes come more often than a full check takes
# since the push tier gates them (D898), and cancelling would leave main never
# checked whole. The newest push waiting runs next; older ones waiting are
# dropped, as GitHub keeps one waiting run per group.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    if: github.repository == 'Rawframe-Project/rawframe-engine'
    runs-on: [self-hosted, linux, x64, rawframe]
    # A backstop against a hang, not the check's budget: a change to a header
    # every tree includes rebuilds all eight, 20 minutes on this machine
    # (D493), and was cancelled at the 20 it had; other work on the shared
    # machine at a load near 200 took the check to 29.5 minutes, and two
    # runs were cancelled at 30 (D876); at a load of 300 to 400, run at a
    # lower priority than the push tier (D898), two were cancelled at 45, the
    # full check taking 51 minutes on the machine alone (D904).
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          clean: false
      # At a lower priority than the push tier on the same machine, which
      # gates the next push while this run checks the last one (D898).
      - run: nice -n 10 tools/check.sh full
