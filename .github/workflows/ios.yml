# iOS, the second mobile target after Android (ADR-0084, D583): on request
# only, while its build is begun. The build job compiles the engine for the
# iOS simulator (D584) against LLVM 20's libc++ built for it, kept between
# runs. The probe job asks what a macOS runner
# offers for it: the Xcode and SDKs there, and whether Xcode's own libc++
# compiles for the iOS simulator what the engine asks of the C++23 library
# (std::expected, and std::from_chars of a double, which NDK r28's libc++
# lacked, D549), and whether LLVM 20's clang does with its own libc++.
name: ios

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'Rawframe-Project/rawframe-engine'
    runs-on: macos-15
    timeout-minutes: 90
    env:
      RAWFRAME_IOS_LIBCXX: ${{ github.workspace }}/../ios/libcxx
      RAWFRAME_DEPENDENCY_CACHE: ${{ github.workspace }}/../ios/dependencies
    steps:
      - uses: actions/checkout@v7
      - name: Tools
        run: brew install llvm@20 ninja ccache >/dev/null
      - name: Kept libc++ and dependencies
        uses: actions/cache@v6
        with:
          path: |
            ${{ github.workspace }}/../ios
          key: ios-${{ hashFiles('tools/build_libcxx_ios.sh', 'tools/build_quic.sh', 'third_party/quic.cmake') }}
      - name: LLVM 20's libc++ for the simulator
        run: |
          [ -f "$RAWFRAME_IOS_LIBCXX/complete" ] || tools/build_libcxx_ios.sh "$RAWFRAME_IOS_LIBCXX"
      - name: Configure
        run: cmake --preset ios-simulator
      - name: Build
        run: |
          set +e
          cmake --build out/ios-simulator -- -k 0 >"$RUNNER_TEMP/build.log" 2>&1
          status=$?
          grep -E "error:|FAILED:" "$RUNNER_TEMP/build.log" | sort | uniq -c | sort -rn | head -80
          tail -20 "$RUNNER_TEMP/build.log"
          exit $status
  probe:
    if: github.repository == 'Rawframe-Project/rawframe-engine'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: What the runner offers
        run: |
          xcodebuild -version
          ls /Applications | grep -i xcode
          xcrun --sdk iphonesimulator --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-path
          xcrun clang++ --version
          xcrun simctl list runtimes | head -20
      - name: Xcode's libc++ for the iOS simulator
        run: |
          cat >"$RUNNER_TEMP/probe.cpp" <<'CPP'
          #include <algorithm>
          #include <charconv>
          #include <cstdio>
          #include <expected>
          #include <ranges>
          #include <string_view>
          #include <vector>

          std::expected<double, int> parsed(std::string_view text) {
              double value = 0;
              const auto [kEnd, kError] = std::from_chars(text.data(), text.data() + text.size(), value);
              if (kError != std::errc{}) {
                  return std::unexpected(1);
              }
              return value;
          }

          int main() {
              std::vector<int> numbers{3, 1, 2};
              std::ranges::sort(numbers);
              char written[32]{};
              const auto kWritten = std::to_chars(written, written + sizeof(written), 0.25);
              std::printf("%g %d %.*s\n", parsed("1.5").value_or(0), numbers.front(),
                          static_cast<int>(kWritten.ptr - written), written);
          }
          CPP
          for xcode in /Applications/Xcode_16.4.app /Applications/Xcode_26.3.app; do
          export DEVELOPER_DIR="$xcode/Contents/Developer"
          xcrun clang++ --version | head -1
          for sdk in iphonesimulator iphoneos; do
            target=arm64-apple-ios16.0
            [ "$sdk" = iphonesimulator ] && target=arm64-apple-ios16.0-simulator
            echo "== $sdk"
            xcrun --sdk "$sdk" clang++ -std=c++23 -target "$target" -fno-exceptions -fno-rtti \
              "$RUNNER_TEMP/probe.cpp" -o "$RUNNER_TEMP/probe-$sdk" && echo "built for $sdk" || echo "not built for $sdk"
          done
          done
      - name: LLVM 20's clang for the iOS simulator
        run: |
          brew install llvm@20 >/dev/null
          clang="$(brew --prefix llvm@20)/bin/clang++"
          "$clang" --version
          "$clang" -std=c++23 -target arm64-apple-ios16.0-simulator \
            -isysroot "$(xcrun --sdk iphonesimulator --show-sdk-path)" -fno-exceptions -fno-rtti \
            "$RUNNER_TEMP/probe.cpp" -o "$RUNNER_TEMP/probe-llvm" && echo "built with LLVM 20 and the SDK's libc++" ||
            echo "not built with LLVM 20 and the SDK's libc++"
      - name: LLVM 20's libc++ built for the iOS simulator
        run: |
          llvm="$(brew --prefix llvm@20)"
          sdk="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          curl -sSfL -o "$RUNNER_TEMP/llvm.tar.xz" \
            https://github.com/llvm/llvm-project/releases/download/llvmorg-20.1.8/llvm-project-20.1.8.src.tar.xz
          shasum -a 256 "$RUNNER_TEMP/llvm.tar.xz"
          tar -xf "$RUNNER_TEMP/llvm.tar.xz" -C "$RUNNER_TEMP"
          start=$(date +%s)
          cmake -S "$RUNNER_TEMP/llvm-project-20.1.8.src/runtimes" -B "$RUNNER_TEMP/libcxx" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER="$llvm/bin/clang" -DCMAKE_CXX_COMPILER="$llvm/bin/clang++" \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT="$sdk" -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.3 -DCMAKE_C_COMPILER_TARGET=arm64-apple-ios16.3-simulator \
            -DCMAKE_CXX_COMPILER_TARGET=arm64-apple-ios16.3-simulator \
            -DLLVM_ENABLE_RUNTIMES="libcxx;libcxxabi" -DLIBCXX_ENABLE_SHARED=OFF -DLIBCXXABI_ENABLE_SHARED=OFF \
            -DLIBCXX_ENABLE_STATIC_ABI_LIBRARY=ON -DLIBCXX_INCLUDE_BENCHMARKS=OFF -DLIBCXX_INCLUDE_TESTS=OFF \
            -DLIBCXXABI_INCLUDE_TESTS=OFF -DLIBCXXABI_USE_LLVM_UNWINDER=OFF -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/libcxx-ios" >"$RUNNER_TEMP/libcxx.log" 2>&1 &&
            cmake --build "$RUNNER_TEMP/libcxx" >>"$RUNNER_TEMP/libcxx.log" 2>&1 &&
            cmake --install "$RUNNER_TEMP/libcxx" >>"$RUNNER_TEMP/libcxx.log" 2>&1 || { tail -40 "$RUNNER_TEMP/libcxx.log"; exit 1; }
          echo "libc++ built in $(( $(date +%s) - start )) s"
          ls "$RUNNER_TEMP/libcxx-ios/lib"
          "$llvm/bin/clang++" -std=c++23 -target arm64-apple-ios16.3-simulator -isysroot "$sdk" -fno-exceptions -fno-rtti \
            -nostdinc++ -isystem "$RUNNER_TEMP/libcxx-ios/include/c++/v1" -nostdlib++ \
            "$RUNNER_TEMP/probe.cpp" "$RUNNER_TEMP/libcxx-ios/lib/libc++.a" -o "$RUNNER_TEMP/probe-own" &&
            echo "built with LLVM 20 and its own libc++" || echo "not built with LLVM 20 and its own libc++"
          xcrun simctl list devices available | grep -m1 iPhone
          device=$(xcrun simctl list devices available | grep -m1 -o 'iPhone [^(]*([0-9A-F-]*)' | grep -o '[0-9A-F-]\{36\}')
          xcrun simctl boot "$device" && xcrun simctl spawn "$device" "$RUNNER_TEMP/probe-own" || echo "not run in the simulator"
