# iOS, the second mobile target after Android (ADR-0084): on request only,
# while its build is begun. The engine is compiled for the iOS simulator
# (D584) against LLVM 20's libc++ built for it, as Xcode's libc++ lacks what
# the engine asks of C++23's library before iOS 26 (D583, whose probe job
# this replaced), and its test programs run in a booted simulator.
name: ios

on:
  workflow_dispatch:
    inputs:
      tests:
        description: Run the test programs in the simulator before playing
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'Rawframe-Project/rawframe-engine'
    runs-on: macos-15
    timeout-minutes: 90
    env:
      RAWFRAME_IOS_LIBCXX: ${{ github.workspace }}/../ios/libcxx
      RAWFRAME_DEPENDENCY_CACHE: ${{ github.workspace }}/../ios/dependencies
      CCACHE_DIR: ${{ github.workspace }}/../ccache
    steps:
      - uses: actions/checkout@v7
      - name: Tools
        run: |
          brew install llvm@20 ninja ccache >/dev/null
          python3 -m pip install --break-system-packages aioquic
      # libc++, MsQuic, and OpenSSL are kept once configure has built them,
      # and the compilations once the build has run, whatever its outcome.
      - name: Restore libc++ and dependencies
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/../ios
          key: ios-${{ hashFiles('tools/build_libcxx_ios.sh', 'tools/build_quic.sh', 'third_party/quic.cmake') }}
      - name: Restore compilations
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/../ccache
          key: ios-ccache-${{ github.sha }}
          restore-keys: ios-ccache-
      - name: LLVM 20's libc++ for the simulator
        run: |
          [ -f "$RAWFRAME_IOS_LIBCXX/complete" ] || tools/build_libcxx_ios.sh "$RAWFRAME_IOS_LIBCXX"
      - name: Configure
        run: cmake --preset ios-simulator
      - name: Keep libc++ and dependencies
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/../ios
          key: ios-${{ hashFiles('tools/build_libcxx_ios.sh', 'tools/build_quic.sh', 'third_party/quic.cmake') }}
        continue-on-error: true
      - name: Build
        run: |
          set +e
          cmake --build out/ios-simulator -- -k 0 >"$RUNNER_TEMP/build.log" 2>&1
          status=$?
          grep -E "error:|FAILED:" "$RUNNER_TEMP/build.log" | sort | uniq -c | sort -rn | head -80
          # What a failed link lacked.
          grep -E -A12 "^FAILED: .*\.app/" "$RUNNER_TEMP/build.log" | grep -v "^ld: warning" | head -120
          tail -20 "$RUNNER_TEMP/build.log"
          exit $status
      - name: Keep compilations
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/../ccache
          key: ios-ccache-${{ github.sha }}
        continue-on-error: true
      - name: Boot a simulator
        run: |
          device=$(xcrun simctl list devices available | grep -m1 -o 'iPhone [^(]*([0-9A-F-]*)' | grep -o '[0-9A-F-]\{36\}')
          xcrun simctl boot "$device"
          # Until it has booted whole, not merely begun.
          xcrun simctl bootstatus "$device" -b
          echo "RAWFRAME_IOS_DEVICE=$device" >>"$GITHUB_ENV"
      - name: Tests in the simulator
        if: inputs.tests
        run: tools/ios_tests.sh out/ios-simulator
      # Runners played by the iOS client against a dedicated server, both
      # in the simulator (D586): its surface made, admitted, and playing,
      # with no device there, as Maul RHI's Metal floor is past the
      # simulator's.
      - name: Play Runners in the simulator
        if: always() && env.RAWFRAME_IOS_DEVICE != ''
        run: tools/ios_play.sh out/ios-simulator
