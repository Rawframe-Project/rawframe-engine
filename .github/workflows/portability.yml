name: portability

# Builds and tests the engine on macOS (D236), Windows (D237), and ARM64
# Linux (D241), targets the owner's machine cannot run, and builds it for
# Android (D549). On GitHub's own runners, which cost a public repository
# nothing, nightly and on request only: no push or pull request triggers it,
# so no fork's code ever runs here or on the owner's machine.
on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
    # One platform's job alone, to see a failure again within its own run
    # time rather than the slowest job's (D813); empty runs them all.
    inputs:
      only:
        description: 'macos, linux-arm64, android, fuzz, or windows; empty for all'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  macos:
    if: github.repository == 'Rawframe-Project/rawframe-engine' && (inputs.only == '' || inputs.only == null || inputs.only == 'macos')
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Tools
        run: |
          brew install llvm@20 ninja ccache
          # The browser's side of the WebTransport test.
          python3 -m pip install --break-system-packages aioquic
      - name: Clang 20 by the names the presets use
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          ln -s "$(brew --prefix llvm@20)/bin/clang" "$RUNNER_TEMP/bin/clang-20"
          ln -s "$(brew --prefix llvm@20)/bin/clang++" "$RUNNER_TEMP/bin/clang++-20"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          # Its headers are LLVM 20's libc++, so programs link that libc++,
          # not the older one macOS carries.
          libcxx="$(brew --prefix llvm@20)/lib/c++"
          echo "LDFLAGS=-L$libcxx -Wl,-rpath,$libcxx" >> "$GITHUB_ENV"
      - name: Configure
        run: cmake --preset clang-development
      - name: Build
        # Past the first failure, so one run shows every file that does not
        # build here.
        run: cmake --build out/clang-development -- -k 0
      # The runner's Apple GPU draws every GPU test: a test that finds no
      # adapter fails rather than skips (D767).
      - name: Test
        env:
          RAWFRAME_REQUIRE_GPU: 1
        run: ctest --test-dir out/clang-development --output-on-failure -j3
      # Stalls exported, played, and read and pressed as a screen reader
      # does (D579): its client's UI through the AX API while it plays, the
      # purse a button named by its coins and pressed, and the collect
      # command that gives sent by the client and taken by the server.
      - name: Read Stalls through the AX API
        run: |
          # Not -e, which a shell step has: a reader that fails still shows
          # what the client and the server said.
          set +e -uo pipefail
          tree=out/clang-development
          "$tree/hosts/export/rawframe-export" games/tycoon "$RUNNER_TEMP/read" \
            --cook "$tree/hosts/cook/rawframe-cook" --build "$tree/hosts/build/rawframe-build" \
            --server "$tree/hosts/dedicated_server/rawframe-server" \
            --client "$tree/hosts/client/rawframe-client" --play "$tree/launcher/play/rawframe-play"
          printf 'host.maximum_iterations = 7200\n' >>"$RUNNER_TEMP/read/client.conf"
          (cd "$RUNNER_TEMP/read" && ./rawframe-play) &
          play=$!
          for _ in $(seq 120); do
            grep -q '"code":"bots_admitted"' "$RUNNER_TEMP/read/client.log" 2>/dev/null && break
            sleep 1
          done
          swift tools/ax_read.swift rawframe-client ' coins$'
          read=$?
          wait "$play"
          grep -o '"code":"\(bots_admitted\|device_ready\|device_unavailable\|frame_summary\)"[^}]*}' "$RUNNER_TEMP/read/client.log" | head -4
          grep -o '"commandsSent":[0-9]*' "$RUNNER_TEMP/read/client.log" | tail -1
          grep -o '"commandsTaken":[0-9]*' "$RUNNER_TEMP/read/server.log" | tail -1
          [ "$read" = 0 ] && grep -q '"commandsSent":1,' "$RUNNER_TEMP/read/client.log" &&
            grep -q '"commandsTaken":1,' "$RUNNER_TEMP/read/server.log"

  # The dedicated server's next target after x86-64 Linux (ADR-0006): ARM
  # servers are the cheaper ones to host on (D241).
  linux-arm64:
    if: github.repository == 'Rawframe-Project/rawframe-engine' && (inputs.only == '' || inputs.only == null || inputs.only == 'linux-arm64')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-20 ninja-build ccache python3-aioquic \
            libwayland-dev wayland-protocols libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev \
            libxcb-randr0-dev libxcb-xkb-dev libxcb-cursor-dev libxcb-xinput-dev \
            libpipewire-0.3-dev libpulse-dev libasound2-dev
      - name: Configure
        run: cmake --preset clang-development
      - name: Build
        run: cmake --build out/clang-development -- -k 0
      - name: Test
        run: ctest --test-dir out/clang-development --output-on-failure -j4

  # Android, the first mobile target (ADR-0084, D549): the engine, its
  # programs, and its tests built for 64-bit ARM against NDK r29, whose libc++
  # parses floating-point numbers (r28's does not), and the client's
  # application made (D551), the tests run on an emulator (D561), and a game
  # exported and played there (D590).
  android:
    if: github.repository == 'Rawframe-Project/rawframe-engine' && (inputs.only == '' || inputs.only == null || inputs.only == 'android')
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache
          curl -sSfL -o "$RUNNER_TEMP/ndk.zip" https://dl.google.com/android/repository/android-ndk-r29-linux.zip
          echo "4abbbcdc842f3d4879206e9695d52709603e52dd68d3c1fff04b3b5e7a308ecf  $RUNNER_TEMP/ndk.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/ndk.zip" -d "$RUNNER_TEMP"
          echo "RAWFRAME_ANDROID_NDK=$RUNNER_TEMP/android-ndk-r29" >> "$GITHUB_ENV"
      - name: Configure
        run: cmake --preset android-development
      - name: Build
        run: cmake --build out/android-development -- -k 0
      - name: Application
        # The client's application, made with the runner's SDK (D551).
        run: tools/android_apk.sh "$RUNNER_TEMP/rawframe-client.apk"
          out/android-development/hosts/android_client/librawframe_client.so dev.rawframe.client "Rawframe client"
      # And a release one under a publisher's key (D581): signed by that key,
      # not debuggable, the keystore's password from the environment.
      - name: Release application
        env:
          RAWFRAME_ANDROID_KEYSTORE_PASSWORD: release-check
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/studio.jks" -storepass "$RAWFRAME_ANDROID_KEYSTORE_PASSWORD" \
            -keypass "$RAWFRAME_ANDROID_KEYSTORE_PASSWORD" -alias studio -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Release check" >/dev/null
          tools/android_apk.sh "$RUNNER_TEMP/rawframe-release.apk" \
            out/android-development/hosts/android_client/librawframe_client.so dev.rawframe.client "Rawframe client" "" \
            "$RUNNER_TEMP/studio.jks" studio
          build="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$build/apksigner" verify --print-certs "$RUNNER_TEMP/rawframe-release.apk" | grep "DN: CN=Release check"
          ! "$build/aapt2" dump badging "$RUNNER_TEMP/rawframe-release.apk" | grep -q debuggable
      # The engine's test programs on an emulator (D561, D581): Android 15
      # on x86_64 with KVM, which runs the arm64 programs through its
      # translation, as the loop's own emulator does.
      - name: Boot the emulator
        timeout-minutes: 20
        env:
          ANDROID_AVD_HOME: /home/runner/.android/avd
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          tools="$ANDROID_HOME/cmdline-tools/latest/bin"
          yes | "$tools/sdkmanager" --licenses >/dev/null 2>&1 || true
          mkdir -p "$ANDROID_AVD_HOME"
          "$tools/sdkmanager" --install emulator "system-images;android-35;google_apis;x86_64" >/dev/null
          echo no | "$tools/avdmanager" create avd -n rawframe35 -k "system-images;android-35;google_apis;x86_64" -d pixel_5 >/dev/null
          nohup "$ANDROID_HOME/emulator/emulator" -avd rawframe35 -no-window -no-audio -no-boot-anim \
            -no-snapshot -gpu swiftshader_indirect -port 5554 >"$RUNNER_TEMP/emulator.log" 2>&1 &
          emulator=$!
          adb="$ANDROID_HOME/platform-tools/adb"
          for _ in $(seq 1 180); do
            [ "$("$adb" -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ] && break
            kill -0 "$emulator" 2>/dev/null || break
            sleep 5
          done
          "$adb" -s emulator-5554 shell getprop sys.boot_completed | grep -q 1 || { tail -50 "$RUNNER_TEMP/emulator.log"; exit 1; }
      - name: Test on the emulator
        timeout-minutes: 60
        run: ADB="$ANDROID_HOME/platform-tools/adb -s emulator-5554" tools/android_tests.sh out/android-development
      # Stalls exported on the emulator and played from the package made of
      # it, a touch on its purse the UI's press and the server's command
      # (D590), and one on its top view switch kept in the player's settings
      # in the app's files (D628). The emulator draws by software (SwiftShader): at the phone's
      # 1080 by 2340 a frame took two and a half seconds, and the purse was
      # not drawn in nine minutes, so the screen is a quarter of that.
      - name: Play exported Stalls on the emulator
        timeout-minutes: 30
        run: |
          adb="$ANDROID_HOME/platform-tools/adb -s emulator-5554"
          $adb shell wm size 540x1170
          ADB="$adb" tools/android_play_exported.sh out/android-development games/tycoon "coins,Top view" '"tycoon.top": 1'

  # A longer search than the check's fixed runs (D242): five minutes a fuzz
  # target from an empty corpus, each finding printed so it can be replayed.
  fuzz:
    if: github.repository == 'Rawframe-Project/rawframe-engine' && (inputs.only == '' || inputs.only == null || inputs.only == 'fuzz')
    runs-on: ubuntu-24.04
    # The targets in three shards, each running every third: five minutes
    # a target, the tools, and the build (26 targets in one job passed its
    # limit and were cancelled, D380).
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-20 ninja-build ccache python3-aioquic \
            libwayland-dev wayland-protocols libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev \
            libxcb-randr0-dev libxcb-xkb-dev libxcb-cursor-dev libxcb-xinput-dev \
            libpipewire-0.3-dev libpulse-dev libasound2-dev
      - name: Configure
        run: cmake --preset clang-sanitize
      - name: Build
        run: cmake --build out/clang-sanitize
      - name: Fuzz
        run: |
          status=0
          mkdir -p findings
          # Each target as the check runs it (its longest input and its
          # seeds), searching for five minutes from a fresh seed instead of
          # a fixed number of inputs. An input that takes past twenty seconds
          # is a finding too: work that grows past its input's size (D764).
          ctest --test-dir out/clang-sanitize --show-only=json-v1 -R '_fuzz_' | python3 -c '
          import json, sys
          shard = int(sys.argv[1])
          for at, test in enumerate(json.load(sys.stdin)["tests"]):
              if at % 3 == shard:
                  print("\t".join(a for a in test["command"] if not a.startswith(("-runs=", "-seed="))))
          ' ${{ matrix.shard }} > fuzz.commands
          while IFS=$'\t' read -r -a command; do
            name="$(basename "${command[0]}")"
            mkdir -p "corpus/$name"
            echo "== $name"
            (cd findings && "${command[@]}" -max_total_time=300 -timeout=20 "../corpus/$name") </dev/null || status=1
          done < fuzz.commands
          for finding in findings/*; do
            [ -f "$finding" ] && { echo "== $finding"; base64 -w0 "$finding"; echo; }
          done
          exit "$status"

  windows:
    if: github.repository == 'Rawframe-Project/rawframe-engine' && (inputs.only == '' || inputs.only == null || inputs.only == 'windows')
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Tools
        shell: pwsh
        run: |
          choco install llvm --version=20.1.8 --allow-downgrade -y --no-progress
          "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH
          # The browser's side of the WebTransport test.
          python -m pip install aioquic
      - name: python3 by that name, as the test scripts call it
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/python3"
          printf '#!/bin/sh\nexec python "$@"\n' > "$RUNNER_TEMP/python3/python3"
          chmod +x "$RUNNER_TEMP/python3/python3"
          echo "$RUNNER_TEMP/python3" >> "$GITHUB_PATH"
      - name: MSVC's developer environment for every later step
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($matches[1])=$($matches[2])" >> $env:GITHUB_ENV }
          }
      # MsQuic and OpenSSL take eight minutes here; they are kept once
      # configure has built them, whatever the later steps do.
      - name: Restore MsQuic and OpenSSL
        uses: actions/cache/restore@v6
        with:
          path: ~/AppData/Local/rawframe
          key: windows-quic-${{ hashFiles('tools/build_quic.sh', 'third_party/quic.cmake') }}
      - name: Configure
        shell: pwsh
        # Git's bash runs tools/build_quic.sh, never WSL's; OpenSSL's
        # Configure wants the Windows perl; the tests' Python is the one
        # aioquic was installed into.
        env:
          RAWFRAME_PERL: C:/Strawberry/perl/bin/perl.exe
        run: >-
          cmake --preset windows-development "-DRAWFRAME_BASH=C:/Program Files/Git/bin/bash.exe"
          "-DPython3_EXECUTABLE=$((Get-Command python).Source)"
      - name: Keep MsQuic and OpenSSL
        uses: actions/cache/save@v6
        with:
          path: ~/AppData/Local/rawframe
          key: windows-quic-${{ hashFiles('tools/build_quic.sh', 'third_party/quic.cmake') }}
        continue-on-error: true
      - name: Build
        shell: pwsh
        run: cmake --build out/windows-development -- -k 0
      # WARP, which ships with Windows, draws every GPU test on Direct3D 12:
      # a test that finds no adapter fails rather than skips (D767).
      - name: Test
        shell: pwsh
        env:
          RAWFRAME_REQUIRE_GPU: 1
        run: ctest --test-dir out/windows-development --output-on-failure -j3
      # The frames the arena's drawn tests wrote, and the Lighting Test's
      # content as Windows cooked it, to look at where one reads differently
      # on WARP than on lavapipe (D765).
      - name: Keep the drawn frames
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: drawn-windows
          path: |
            out/windows-development/hosts/arena/*.tga
            out/windows-development/hosts/arena/lighting_content/
          retention-days: 14
      # What the scene's tests drew on Direct3D 12: a material's face and
      # parameters (D705, D708), and each light and what the frame does with
      # it, printed to compare with lavapipe's (D765), and run after a failed
      # test too. The tests themselves are required in the step above (D767).
      - name: The scene on Direct3D 12
        if: success() || failure()
        shell: bash
        continue-on-error: true
        # The harness takes one filter, so each test is run on its own.
        run: |
          for test in AMaterialKnowsTheFaceItIsDrawnOn AMaterialReadsItsParametersFromItsBlob \
              AnEmptySceneIsTheSky TheSkysPictureIsSeenTheWayEachPointLooks TheLitModelReflectsTheSunAndTheSky \
              TheGroundLightsWhatFacesDown TheSunCastsShadows PointAndSpotLightsLightWhatTheyReach \
              LampsSharingAClusterEachLightWithTheirOwnColor \
              PunctualLightsCastShadowsThroughTheirAtlas SurfacesAreLitByThePictureAndReflectIt \
              APointReflectsTheProbesThatHoldIt TheFloorAtABlocksFootIsDarkerWithAmbientOcclusion \
              ABrightGlowSpreadsWithTheBloom AMirrorFloorShowsTheBlockOnItWithScreenSpaceReflections \
              TheFloorBesideABlockIsShadedByContactShadows AMeteredExposureFindsTheScenesLight \
              AFramesLightIsReadBackInPhysicalUnits; do
            out/windows-development/modules/render_scene_gpu/rawframe_render_scene_gpu_tests.exe "$test"
          done
      # The sample games to play on Windows (D515): each exported as the
      # export tool makes a folder, whose rawframe-play starts its server and
      # then its client in a window, with the DLLs its programs import from
      # the build beside them (MsQuic's and OpenSSL's, say) and the C++
      # runtime's, kept two weeks.
      - name: Export the sample games
        shell: bash
        run: |
          set -euo pipefail
          tree=out/windows-development
          for game in plaza tycoon runners reach; do
            # Reach is shown on a headset where the machine has one (D658).
            headset=false
            [ "$game" = reach ] && headset=true
            "$tree/hosts/export/rawframe-export.exe" "games/$game" "played/$game" \
              --cook "$tree/hosts/cook/rawframe-cook.exe" --build "$tree/hosts/build/rawframe-build.exe" \
              --server "$tree/hosts/dedicated_server/rawframe-server.exe" \
              --client "$tree/hosts/client/rawframe-client.exe" --play "$tree/launcher/play/rawframe-play.exe" \
              --headset "$headset"
            for program in "played/$game"/*.exe; do
              for dll in $(llvm-objdump -p "$program" | sed -n 's/^ *DLL Name: //p' | tr -d '\r'); do
                [ -e "played/$game/$dll" ] && continue
                found="$(find "$tree" -name "$dll" -print -quit)"
                [ -z "$found" ] && [ -e "/c/Windows/System32/$dll" ] && case "${dll,,}" in
                  vcruntime*|msvcp*|concrt*) found="/c/Windows/System32/$dll" ;;
                esac
                [ -n "$found" ] && cp "$found" "played/$game/"
              done
            done
            ls "played/$game"
          done
      # A copy of each exported game played for five seconds, as a player
      # would start it: its client admitted and showing frames on this
      # machine, which has no GPU but Direct3D 12's software one (D517).
      - name: Play the exported games
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          for game in plaza tycoon runners reach; do
            cp -r "played/$game" "$RUNNER_TEMP/$game"
            printf 'host.maximum_iterations = 600\n' >>"$RUNNER_TEMP/$game/client.conf"
            # The plaza starts on the whole screen (D523).
            [ "$game" = plaza ] && printf 'window.fullscreen = true\n' >>"$RUNNER_TEMP/$game/client.conf"
            (cd "$RUNNER_TEMP/$game" && timeout 180 ./rawframe-play.exe; echo "$game: rawframe-play exit $?")
            for log in server client; do
              grep -o '"code":"\(bots_admitted\|frame_summary\|device_ready\|device_unavailable\|start_failed\)"[^}]*}[^}]*}' \
                "$RUNNER_TEMP/$game/$log.log" || echo "$game $log: nothing of note"
            done
            grep -q '"framesShown":[1-9]' "$RUNNER_TEMP/$game/client.log" || { echo "$game showed no frame"; failed=1; }
            if [ "$game" = plaza ]; then
              # On the whole screen its view is the screen's, not the
              # window's 720 logical pixels high.
              grep -o '"viewWidth":[0-9]*,"viewHeight":[0-9]*' "$RUNNER_TEMP/$game/client.log" | tail -1
              grep '"code":"scene_summary"' "$RUNNER_TEMP/$game/client.log" | grep -q '"viewHeight":720,' &&
                { echo "plaza was not on the whole screen"; failed=1; }
            fi
          done
          exit "$failed"
      # Studio packaged for an author with no build (D768), opened on each
      # game for a few seconds on WARP, and kept two weeks.
      - name: Package Studio
        shell: bash
        run: |
          set -euo pipefail
          tools/package_studio.sh out/windows-development studio runners plaza tycoon
          for game in runners plaza tycoon; do
            # The package names no game (D921): each opened as the start
            # screen opens it, with preferences of its own.
            (cd studio && printf 'studio.game = games/%s/%s.game\nstudio.preferences = opened.preferences\nhost.maximum_iterations = 600\n' "$game" "$game" >opened.conf &&
              timeout 120 ./rawframe-studio.exe --config opened.conf >opened.log 2>&1) || true
            grep -q '"code":"studio_shown"' studio/opened.log || { cat studio/opened.log; echo "studio did not open $game"; exit 1; }
            echo "studio opened $game"
            rm -rf studio/opened.conf studio/opened.log studio/opened.preferences studio/pictures
          done
      - name: Keep Studio
        uses: actions/upload-artifact@v7
        with:
          name: studio-windows
          path: studio/
          retention-days: 14
      # Stalls read and pressed as a screen reader does (D579): its client's
      # UI through UI Automation while it plays, the purse a button named by
      # its coins and invoked, and the collect command that gives sent by
      # the client and taken by the server.
      - name: Read Stalls through UI Automation
        shell: bash
        run: |
          # Not -e, which a shell step has: a reader that fails still shows
          # what the client and the server said.
          set +e -uo pipefail
          cp -r played/tycoon "$RUNNER_TEMP/read"
          printf 'host.maximum_iterations = 7200\n' >>"$RUNNER_TEMP/read/client.conf"
          (cd "$RUNNER_TEMP/read" && timeout 180 ./rawframe-play.exe) &
          play=$!
          for _ in $(seq 120); do
            grep -q '"code":"bots_admitted"' "$RUNNER_TEMP/read/client.log" 2>/dev/null && break
            sleep 1
          done
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/uia_read.ps1 rawframe-client ' coins$'
          read=$?
          wait "$play"
          grep -o '"commandsSent":[0-9]*' "$RUNNER_TEMP/read/client.log" | tail -1
          grep -o '"commandsTaken":[0-9]*' "$RUNNER_TEMP/read/server.log" | tail -1
          [ "$read" = 0 ] && grep -q '"commandsSent":1,' "$RUNNER_TEMP/read/client.log" &&
            grep -q '"commandsTaken":1,' "$RUNNER_TEMP/read/server.log"
      - name: Keep the sample games
        uses: actions/upload-artifact@v7
        with:
          name: rawframe-games-windows
          path: played/
          retention-days: 14
