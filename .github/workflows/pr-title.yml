# The pull request title becomes the commit on main and the changelog
# line, so it must be a conventional commit with one of the scopes
# AGENTS.md lists.
name: pull request title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  title:
    uses: Rawframe-Project/.github/.github/workflows/pr-title.yml@213c907c6da14ac2e3887c27164e685ebcb2b8e7 # v0.0.44
    permissions:
      pull-requests: read
    with:
      scopes: >-
        base execution composition host world kest network replication physics navigation content cook
        packaging launcher render material ui input window audio animation localization scene authoring
        studio tooling xr web android ios games deps build check
