# The canonical profile, which the bench and the soak serve the crowd
# under. Overload: at most two catch-up ticks an iteration, degraded
# (admission closed) 100 ms behind, overloaded at once 500 ms behind or after
# 5 s degraded. Processors: MsQuic on two, as on the two-CPU slice
# the 1.5-CPU budget deploys to. State: each connection
# is published to 20 times a second, the current-state production.
world.maximum_ticks_per_iteration = 2
world.degraded_ms = 100
world.debt_limit_ms = 500
world.overload_ms = 5000
network.quic.processors = 2
replication.state_rate = 20
