# Eight bots dig and build on Quarry for five seconds of play, their
# tools aimed and pressed at random: the land is made from the World's
# seed, and the bots' digs and placements change it.
host.maximum_iterations = 600
host.iteration_rate = 120
world.tick_rate = 60
kest.game = ../../../games/quarry/quarry.game
network.loopback.latency_ms = 10
replication.endpoint = arena
bots.count = 8
bots.endpoint = arena
