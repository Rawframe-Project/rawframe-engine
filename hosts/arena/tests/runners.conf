# server's physics summary shows the level and a runner for each player made,
# and the runners moved as characters.
host.maximum_iterations = 120
host.iteration_rate = 120
world.tick_rate = 60
kest.game = ../../../games/runners/runners.game
network.loopback.latency_ms = 10
replication.endpoint = arena
bots.count = 16
bots.endpoint = arena
