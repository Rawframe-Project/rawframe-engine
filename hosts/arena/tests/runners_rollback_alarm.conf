# SPEC-0041's rollback_rate_alarm (D207): with the alarm at nought, any second
# with a rollback is pathological, so four predicting bots report at least one
# and play on. Their rollbacks come from a seeded jitter and loss, not only
# from their input first arriving: a run timed well enough had none (D557).
host.maximum_iterations = 600
host.iteration_rate = 120
world.tick_rate = 60
kest.game = ../../../games/runners/runners.game
network.loopback.latency_ms = 10
network.loopback.jitter_ms = 60
network.loopback.loss_ppm = 100000
network.loopback.seed = 7
replication.endpoint = arena
bots.count = 4
bots.endpoint = arena
bots.rollback_alarm = 0
