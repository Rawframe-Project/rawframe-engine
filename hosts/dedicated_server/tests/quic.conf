# The server serving the arena game over QUIC for a short while, with an
# identity made at start. Port 0 lets the system choose, so runs in parallel
# never collide; nothing connects here.
host.maximum_iterations = 30
host.iteration_rate = 1000
world.tick_rate = 1000
kest.game = games/arena/arena.game
kest.library = third_party/kest/lib/
network.quic.self_signed = true
replication.endpoint = 127.0.0.1:0
